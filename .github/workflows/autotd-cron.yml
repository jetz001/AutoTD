name: AutoTD 24/7 Autopilot Cloud Trader

on:
  schedule:
    # Run every 10 minutes continuously 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: autotd-cron-execution
  cancel-in-progress: true

jobs:
  trade-cycle:
    name: Autopilot Quant Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Autopilot Trading Cycle
        run: node scripts/cloud-trader.js
