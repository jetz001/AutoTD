name: AutoTD 24/7 Autopilot Cloud Trader

on:
  schedule:
    # Run every 5 minutes continuously 24/7 on Microsoft Azure / AWS
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform: cycle, sell, buy'
        required: false
        default: 'cycle'
      symbol:
        description: 'Target symbol (e.g. MOODENGUSDT)'
        required: false
        default: ''
      amount:
        description: 'Amount or size'
        required: false
        default: ''

concurrency:
  group: autotd-cron-execution
  cancel-in-progress: false

jobs:
  trade-cycle:
    name: Autopilot Quant Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Autopilot Trading Cycle
        env:
          INPUT_ACTION: ${{ github.event.inputs.action || 'cycle' }}
          INPUT_SYMBOL: ${{ github.event.inputs.symbol || '' }}
          INPUT_AMOUNT: ${{ github.event.inputs.amount || '' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/cloud-trader.js
