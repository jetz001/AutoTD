name = "bitget-ai-trader"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Serve static dashboard UI
assets = { directory = "./public", binding = "ASSETS" }

# Cron triggers:
# 1. ลูปเทรด: ปลุกวิเคราะห์ & เทรดทุก 5 นาที
# 2. ลูป AI Discovery: ปลุกค้นหาโมเดล OpenRouter Free 6 ตัวล่าสุดทุกวัน
[triggers]
crons = ["*/5 * * * *", "0 0 * * *"]

# Environment Variables
[vars]
TRADING_MODE = "SPOT"
DEFAULT_SYMBOL = "BTCUSDT"
MAX_LEVERAGE = "1"
MAX_RISK_PERCENT = "5"
PAPER_TRADING = "false"
AI_PROVIDER = "openrouter"
